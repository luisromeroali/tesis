<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema Web para la Gestión Administrativa de la Empresa Refrigeración Rufo 1, C.A." />
  <title>Iniciar Sesión | Refrigeración Rufo 1, C.A.</title>

  <!-- Tipografía Geist desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

  <!-- Hojas de Estilo del Login -->
  <link rel="stylesheet" href="src/assets/css/login.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <!-- Logo encima del formulario -->
      <div class="logo-container">
        <img src="src/assets/logo.jpg" alt="Logo Refrigeración Rufo" class="company-logo" />
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- Alerta de Validación / Respuesta -->
        <div id="feedbackAlert" class="feedback-alert" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" x2="12" y1="8" y2="12"/>
            <line x1="12" x2="12.01" y1="16" y2="16"/>
          </svg>
          <div id="feedbackMessage"></div>
        </div>

        <!-- Campo: Usuario -->
        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Ingrese su usuario"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="password-toggle"
              aria-label="Mostrar contraseña"
              title="Mostrar u ocultar contraseña"
            >
              <!-- Icono Ojo Abierto -->
              <svg id="eyeOpenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Icono Ojo Cerrado -->
              <svg id="eyeClosedIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Opciones Adicionales -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" class="checkbox-input" />
            <span>Mantener sesión activa</span>
          </label>

          <button type="button" id="forgotPasswordBtn" class="forgot-password-btn">
            ¿Olvidó su contraseña?
          </button>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span id="submitBtnText">Ingresar al Sistema</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- Modal de Política de Seguridad (Cambio de Contraseñas) -->
  <div
    id="securityModalBackdrop"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="securityModalTitle"
    aria-hidden="true"
  >
    <div class="security-modal">
      <div class="modal-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
      </div>

      <h3 id="securityModalTitle" class="modal-title">Política de Seguridad de Accesos</h3>

      <p class="modal-text">
        Para garantizar la integridad de los registros en <strong>Refrigeración Rufo 1, C.A.</strong>, la gestión de credenciales está centralizada.
      </p>

      <div class="modal-policy-box">
        <strong>Restricción de Seguridad:</strong>
        Únicamente el <strong>Administrador</strong> posee privilegios para modificar o cambiar contraseñas dentro del sistema.
      </div>

      <button type="button" id="closeSecurityModalBtn" class="modal-close-btn">
        Entendido
      </button>
    </div>
  </div>

  <!-- Subsistema de Auditoría y Trazabilidad -->
  <script src="src/assets/js/audit.js"></script>

  <!-- Lógica de Interactividad y Validación -->
  <script src="src/assets/js/login.js"></script>
</body>
</html>
